services:
  gateway:
    image: traefik:v3
    container_name: nau-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=nau-network
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt-dns.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt-dns.acme.storage=/acme.json
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    networks:
      - nau-network
      - violeta-network
      - karen-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    container_name: nau-backup
    restart: unless-stopped
    environment:
      - R2_BUCKET_NAME=${BACKUP_R2_BUCKET_NAME}
      - R2_ACCESS_KEY_ID=${BACKUP_R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${BACKUP_R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${BACKUP_R2_ENDPOINT}
      - API_DB_PASSWORD=${API_DB_PASSWORD}
      - FLOWNAU_DB_PASSWORD=${FLOWNAU_DB_PASSWORD}
      - NAUTHENTICITY_DB_PASSWORD=${NAUTHENTICITY_DB_PASSWORD}
      - ZAZU_DB_PASSWORD=${ZAZU_DB_PASSWORD}
      - CONNECT_DB_PASSWORD=${CONNECT_DB_PASSWORD}
      - WHATSNAU_DB_PASSWORD=${WHATSNAU_DB_PASSWORD}
      - VIOLETA_LISTMONK_DB_PASSWORD=${VIOLETA_LISTMONK_DB_PASSWORD}
      - FREESCOUT_DB_PASSWORD=${FREESCOUT_DB_PASSWORD}
      # Alerting goes direct to Telegram, not through the platform: an alert path
      # that depends on the system being backed up is not an alert path.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - BACKUP_NOTIFY_ON_SUCCESS=${BACKUP_NOTIFY_ON_SUCCESS:-false}
      # Dumps are encrypted before leaving the machine. Only the public key is
      # here — the server cannot decrypt its own backups, so compromising it
      # does not expose the archive.
      - BACKUP_AGE_PUBLIC_KEY=${BACKUP_AGE_PUBLIC_KEY}
    volumes:
      # Dumps must outlive the container. The previous image wrote to /tmp, so a
      # rebuild would have destroyed the only copies that existed while the R2
      # uploads were failing.
      - ./backups/auto:/backups
    networks:
      - nau-network
      - violeta-network
      - karen-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.20'

networks:
  nau-network:
    external: true
  violeta-network:
    external: true
  karen-network:
    external: true
