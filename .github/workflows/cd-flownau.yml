name: CD — flownau

# Deploys flownau. Triggered only by ci-flownau.yml succeeding on main — see
# cd-api.yml for the pattern this follows. The Next.js build output produced
# by ci-flownau.yml's build job is fetched here by that run's id, via
# github.event.workflow_run.id — actions/download-artifact resolves artifacts
# from the specified run, not just the current one.
on:
  workflow_run:
    workflows: ["CI — flownau"]
    types: [completed]

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Next.js build output
        uses: actions/download-artifact@v4
        with:
          name: flownau-next-build
          path: apps/flownau/.next/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: apps/flownau
          file: apps/flownau/Dockerfile
          push: true
          tags: |
            ghcr.io/samuelaure/nau/flownau:latest
            ghcr.io/samuelaure/nau/flownau:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push renderer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/flownau/Dockerfile.renderer
          push: true
          tags: |
            ghcr.io/samuelaure/nau/flownau-renderer:latest
            ghcr.io/samuelaure/nau/flownau-renderer:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  init:
    name: Initialize deployment environment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Initialize server and network
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker network create nau-network 2>/dev/null || true
            mkdir -p ~/apps/{api,flownau,accounts,app,nauthenticity,zazu,whatsnau}
            docker pull pgvector/pgvector:pg16 2>/dev/null || true

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [publish, init]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Sync docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/flownau/docker-compose.yml
          target: ~/apps/flownau/
          strip_components: 2
      - uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          command_timeout: 10m
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "${{ secrets.FLOWNAU_ENV_FILE }}" > ~/apps/flownau/.env
            cd ~/apps/flownau
            docker compose pull
            docker compose up -d flownau-postgres flownau-redis
            docker compose run --rm --no-deps flownau npx prisma migrate deploy
            docker compose up -d
            docker image prune -f || true
