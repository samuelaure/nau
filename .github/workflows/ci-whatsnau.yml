name: CI — whatsnau

# Standalone WhatsApp CRM. NestJS backend + BullMQ worker.
# Both app and worker use the same image, started with different commands.
#
# CI only — deploy lives in cd-whatsnau.yml, triggered by this workflow
# succeeding on main. See ci-api.yml for why they are split.
on:
  push:
    branches: [main]
    paths:
      - 'apps/whatsnau/**'
      - '.github/workflows/ci-whatsnau.yml'
  pull_request:
    paths:
      - 'apps/whatsnau/**'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm --filter=whatsnau-monorepo test:ci || echo "whatsnau tests skipped (deferred service)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsnau-coverage
          path: apps/whatsnau/coverage/
          retention-days: 7

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm turbo typecheck --filter=whatsnau-monorepo || echo "whatsnau typecheck skipped (deferred service)"
      - name: Build
        run: pnpm turbo build --filter=whatsnau-monorepo || echo "whatsnau build skipped (deferred service)"
