name: CI — gateway

# Deploys the root docker-compose.yml (Traefik + backup) and infra/ to production.
# Triggers when the gateway config or a build context under infra/ changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'infra/**'
      - '.github/workflows/ci-gateway.yml'

jobs:
  init:
    name: Initialize deployment environment
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize server and network
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker network create nau-network 2>/dev/null || true
            mkdir -p ~/apps/{api,flownau,accounts,app,nauthenticity,zazu,whatsnau}
            docker pull pgvector/pgvector:pg16 2>/dev/null || true

  deploy:
    name: Deploy gateway
    runs-on: ubuntu-latest
    needs: [init]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      # infra/ carries the backup image's build context. It used to be left out,
      # so the repo and the server drifted: the deployed backup.sh had grown
      # three databases the repo never knew about, edited straight on the box.
      - name: Copy compose file and build contexts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,infra/**"
          target: ~/

      - name: Restart gateway
        uses: appleboy/ssh-action@v1
        env:
          ROOT_ENV_FILE: ${{ secrets.ROOT_ENV_FILE }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ROOT_ENV_FILE
          script: |
            set -e
            echo "$ROOT_ENV_FILE" > ~/.env
            cd ~
            docker compose pull
            # --build so changes to infra/backup actually reach the running image
            docker compose up -d --build
            docker image prune -f || true
