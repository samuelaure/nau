name: CI — accounts

# Next.js 14 SSO identity hub. Uses Vitest + @testing-library/react.
# Server actions are tested by mocking fetch and next/headers — no real API needed.
#
# CI only — deploy lives in cd-accounts.yml, triggered by this workflow
# succeeding on main. See ci-api.yml for why they are split.
on:
  push:
    branches: [main]
    paths:
      - 'apps/accounts/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-accounts.yml'
  pull_request:
    paths:
      - 'apps/accounts/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'

      - name: Run unit tests with coverage
        run: pnpm --filter=@9nau/accounts test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-coverage
          path: apps/accounts/coverage/
          retention-days: 7

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'
      - name: Typecheck
        run: pnpm turbo typecheck --filter=@9nau/accounts
      - name: Build
        run: pnpm turbo build --filter=@9nau/accounts
