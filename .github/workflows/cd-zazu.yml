name: CD — zazu

# Deploys zazu. Triggered only by ci-zazu.yml succeeding on main — see
# cd-api.yml for the pattern this follows.
on:
  workflow_run:
    workflows: ["CI — zazu"]
    types: [completed]

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/zazu/Dockerfile
          push: true
          tags: |
            ghcr.io/samuelaure/nau/zazu:latest
            ghcr.io/samuelaure/nau/zazu:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  init:
    name: Initialize deployment environment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Initialize server and network
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker network create nau-network 2>/dev/null || true
            mkdir -p ~/apps/{api,flownau,accounts,app,nauthenticity,zazu,whatsnau}
            docker pull pgvector/pgvector:pg16 2>/dev/null || true

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [publish, init]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Write env file on runner
        env:
          ZAZU_ENV_FILE: ${{ secrets.ZAZU_ENV_FILE }}
        run: printf '%s' "$ZAZU_ENV_FILE" > apps/zazu/.env.production.deploy
      - name: Sync files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/zazu/docker-compose.yml,apps/zazu/.env.production.deploy
          target: ~/apps/zazu/
          strip_components: 2
      - uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mv ~/apps/zazu/.env.production.deploy ~/apps/zazu/.env
            cd ~/apps/zazu
            docker compose pull
            docker compose up -d zazu-postgres
            docker compose run --rm --no-deps -w /app/packages/zazu-db zazu npx prisma migrate deploy
            docker compose up -d
            docker image prune -f || true
