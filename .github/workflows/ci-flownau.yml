name: CI — flownau

# flownau uses Vitest (not Jest). test:ci = "vitest --run --coverage".
# DATABASE_URL dummy prevents config module from crashing at import time.
#
# CI only — deploy lives in cd-flownau.yml, triggered by this workflow
# succeeding on main. See ci-api.yml for why they are split. The Next.js
# build output still needs to cross into the deploy workflow (docker build
# there does not rerun `next build`), so this job uploads it as an artifact
# for cd-flownau.yml to download by the triggering run's id.
on:
  push:
    branches: [main]
    paths:
      - 'apps/flownau/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-flownau.yml'
  pull_request:
    paths:
      - 'apps/flownau/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'

      - name: Run unit tests with coverage
        run: pnpm --filter=flownau test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flownau-coverage
          path: apps/flownau/coverage/
          retention-days: 7

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    needs: test
    env:
      # NEXT_PUBLIC_* vars are baked into the Next.js bundle at build time — set them here.
      NEXT_PUBLIC_ACCOUNTS_URL: https://accounts.9nau.com
      NEXT_PUBLIC_APP_URL: https://app.9nau.com
      NEXT_PUBLIC_FLOWNAU_URL: https://flownau.9nau.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'
      - name: Generate Prisma client
        run: pnpm --filter=flownau prisma:generate
      - name: Typecheck
        run: pnpm turbo typecheck --filter=flownau
      - name: Build
        run: pnpm turbo build --filter=flownau

      - name: Upload Next.js build output
        uses: actions/upload-artifact@v4
        with:
          name: flownau-next-build
          path: apps/flownau/.next/
          retention-days: 1
          include-hidden-files: true
