name: CI — api

# Triggers on any push to main or PR touching api app or shared packages.
# Tests run BEFORE build so failures surface fast without wasting build time.
# Unit tests mock all Prisma calls via jest-mock-extended — no database needed.
#
# CI only — it never publishes an image or deploys. That happens in
# cd-api.yml, which triggers on this workflow finishing green on main. Keeping
# them apart means a push to a branch or a PR can never touch production,
# whatever job graph this file grows.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!
      OPENAI_API_KEY: ci-test-openai-key

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'
      - name: Generate Prisma client
        run: pnpm --filter=@9nau/api exec npx prisma generate

      - name: Run unit tests with coverage
        run: pnpm --filter=@9nau/api test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'
      - name: Generate Prisma client
        run: pnpm --filter=@9nau/api exec npx prisma generate
      - name: Typecheck
        run: pnpm turbo typecheck --filter=@9nau/api
      # The published contract must match the code that serves it. Five services
      # consume this api and none of them can see a change to it until the spec
      # changes too, so a stale spec fails the build rather than shipping.
      - name: Check the published contract is current
        run: pnpm --filter=@9nau/api contract:check
        env:
          NODE_ENV: test
          AUTH_SECRET: ci-test-secret-32-chars-minimum!!
          ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build
        run: pnpm turbo build --filter=@9nau/api
