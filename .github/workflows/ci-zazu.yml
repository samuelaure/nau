name: CI — zazu

# Express + Telegraf Telegram bot. Uses Vitest.
# SkillManager and service-auth middleware tested with mocked Telegraf contexts.
#
# CI only — deploy lives in cd-zazu.yml, triggered by this workflow succeeding
# on main. See ci-api.yml for why they are split.
on:
  push:
    branches: [main]
    paths:
      - 'apps/zazu/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-zazu.yml'
  pull_request:
    paths:
      - 'apps/zazu/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!
      TELEGRAM_BOT_TOKEN: ci-bot-token

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter='./packages/**'

      - name: Run unit tests with coverage
        run: pnpm --filter=@zazu/bot test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zazu-coverage
          path: apps/zazu/coverage/
          retention-days: 7

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm turbo typecheck --filter=@zazu/bot
      - name: Build
        run: pnpm turbo build --filter=@zazu/bot
