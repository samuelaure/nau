name: CD — whatsnau

# Deploys whatsnau. Triggered only by ci-whatsnau.yml succeeding on main —
# see cd-api.yml for the pattern this follows. whatsnau is a deferred service
# without a Dockerfile yet, so publish/deploy stay conditional on one existing,
# exactly as they were before the split.
on:
  workflow_run:
    workflows: ["CI — whatsnau"]
    types: [completed]

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    outputs:
      dockerfile_exists: ${{ steps.check_dockerfile.outputs.exists }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f apps/whatsnau/Dockerfile ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check_dockerfile.outputs.exists == 'true'
      - uses: docker/login-action@v3
        if: steps.check_dockerfile.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.check_dockerfile.outputs.exists == 'true'
        with:
          context: .
          file: apps/whatsnau/Dockerfile
          push: true
          tags: |
            ghcr.io/samuelaure/nau/whatsnau:latest
            ghcr.io/samuelaure/nau/whatsnau:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  init:
    name: Initialize deployment environment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Initialize server and network
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker network create nau-network 2>/dev/null || true
            mkdir -p ~/apps/{api,flownau,accounts,app,nauthenticity,zazu,whatsnau}
            docker pull pgvector/pgvector:pg16 2>/dev/null || true

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [publish, init]
    if: needs.publish.outputs.dockerfile_exists == 'true'
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Sync docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: apps/whatsnau/docker-compose.yml
          target: ~/apps/whatsnau/
          strip_components: 2
      - uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "${{ secrets.WHATSNAU_ENV_FILE }}" > ~/apps/whatsnau/.env
            cd ~/apps/whatsnau
            docker compose pull
            docker compose up -d
